services:
  tksignal-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: ${COMPOSE_CONTAINER_NAME:-tksignal-bot}
    restart: ${COMPOSE_RESTART_POLICY:-unless-stopped}

    env_file:
      - ${APP_ENV_FILE:-.env}

    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - TZ=${TZ:-Asia/Bangkok}
      - ENVIRONMENT=${ENVIRONMENT:-development}

    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./logs:/app/logs
      - tksignal-bot-data:/app/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen('https://api.telegram.org/bot' + os.environ['TELEGRAM_BOT_TOKEN'] + '/getMe')"
        ]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: ${HEALTHCHECK_START_PERIOD:-40s}

    deploy:
      resources:
        limits:
          cpus: '${COMPOSE_CPU_LIMIT:-0.5}'
          memory: ${COMPOSE_MEMORY_LIMIT:-512M}
        reservations:
          cpus: '${COMPOSE_CPU_RESERVATION:-0.1}'
          memory: ${COMPOSE_MEMORY_RESERVATION:-128M}

    logging:
      driver: "json-file"
      options:
        max-size: "${COMPOSE_LOG_MAX_SIZE:-10m}"
        max-file: "${COMPOSE_LOG_MAX_FILE:-3}"

    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /tmp

  watchtower:
    image: containrrr/watchtower
    container_name: ${WATCHTOWER_CONTAINER_NAME:-tksignal-watchtower}
    restart: unless-stopped
    profiles: ["production"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-86400}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_NOTIFICATIONS=${WATCHTOWER_NOTIFICATIONS:-email}
      - WATCHTOWER_NOTIFICATION_EMAIL_FROM=${WATCHTOWER_NOTIFICATION_EMAIL_FROM:-noreply@yourdomain.com}
      - WATCHTOWER_NOTIFICATION_EMAIL_TO=${WATCHTOWER_NOTIFICATION_EMAIL_TO:-admin@yourdomain.com}
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER=${WATCHTOWER_NOTIFICATION_EMAIL_SERVER:-smtp.gmail.com}
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PORT=${WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PORT:-587}
    command: ${WATCHTOWER_TARGET_CONTAINER:-tksignal-bot}

networks:
  default:
    name: ${COMPOSE_NETWORK_NAME:-tksignal-network}
    driver: bridge

volumes:
  tksignal-bot-data:
    name: ${COMPOSE_DATA_VOLUME_NAME:-tksignal-bot-data}
